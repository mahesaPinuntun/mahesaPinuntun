name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Diperbarui ke v4 agar kompatibel dengan Node.js modern

      - name: Generate Pacman Animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          # Parameter 'output_file' dihapus karena tidak didukung oleh action ini

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4 # Diperbarui ke v4 agar kompatibel dengan Node.js modern
        with:
          target_branch: output
          build_dir: .
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "Update pacman contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
